# 应用服务 WEB 访问端口
server.port=8080

# 本地开发配置（含数据库密码）放在 application-local.properties，
# 该文件已被 .gitignore 排除，不会提交到仓库
spring.profiles.active=local

spring.datasource.url=jdbc:mysql://localhost:3306/lab?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:你的密码}

# 实体类有改动时自动同步表结构；开发阶段使用，生产环境应关闭
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
